name: Student Toolkit Beta APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Diagnose Android and Gradle environment
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
          command -v sdkmanager || true
          find /usr/local/lib/android /opt -name sdkmanager -type f 2>/dev/null | head -20 || true
          echo "Repository files:"
          find . -maxdepth 4 -type f | sort | head -100
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Validate generated APK
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          echo "APK bytes: $(stat -c%s "$APK")"
          unzip -t "$APK"
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          AAPT="$(find "$SDK/build-tools" -maxdepth 2 -type f -name aapt -print | sort -V | tail -1)"
          APKSIGNER="$(find "$SDK/build-tools" -maxdepth 2 -type f -name apksigner -print | sort -V | tail -1)"
          test -n "$AAPT" && test -n "$APKSIGNER"
          "$AAPT" dump badging "$APK" | head -15
          "$APKSIGNER" verify --verbose --print-certs "$APK"
      - name: Run all instrumentation tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            set -o pipefail
            adb wait-for-device
            adb shell getprop sys.boot_completed
            adb shell input keyevent 82
            echo "=== Run Settings + Privacy in isolation ==="
            gradle :app:connectedDebugAndroidTest --no-daemon --stacktrace --info -Pandroid.testInstrumentationRunnerArguments.class=com.studenttoolkit.app.SettingsPrivacyTest 2>&1 | tee instrumentation.log
            SETTINGS_RESULT=${PIPESTATUS[0]}
            if [ "$SETTINGS_RESULT" -eq 0 ]; then
              echo "=== Run complete instrumentation suite ===" | tee -a instrumentation.log
              gradle :app:connectedDebugAndroidTest --no-daemon --stacktrace --info 2>&1 | tee -a instrumentation.log
            else
              echo "Settings test failed; preserving isolated failure diagnostics" | tee -a instrumentation.log
              false
            fi
            RESULT=${PIPESTATUS[0]}
            if [ "$RESULT" -ne 0 ]; then
              echo "=== Instrumentation crash diagnostics ==="
              adb logcat -d -t 1500 -v time | grep -E -A 12 -B 8 'FATAL EXCEPTION|AndroidRuntime|INSTRUMENTATION_FAILED|Process crashed|com.studenttoolkit.app|TestRunner' | tail -350 || true
              echo "=== Test result files ==="
              find app/build/outputs/androidTest-results app/build/reports/androidTests -type f 2>/dev/null | sort || true
            fi
            exit "$RESULT"
      - name: Upload instrumentation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumentation-diagnostics
          path: |
            instrumentation.log
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
          if-no-files-found: warn
      - name: Upload beta APK
        uses: actions/upload-artifact@v4
        with:
          name: StudentToolkit-V1-beta-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
